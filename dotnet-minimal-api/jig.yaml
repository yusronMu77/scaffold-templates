name: ".NET (ASP.NET Core Minimal API)"
description: "Registry of supported variants, plus everything identical across all of them"

# LEVEL 1, mirroring spring-boot/jig.yaml's own split: anything whose *shape* is the same for
# every dotnet-minimal-api variant lives here (.gitignore, .editorconfig, the three variables
# every variant needs). Unlike the other new scaffolds, the project manifest (.csproj) is NOT
# shared here - a future variant (e.g. an MVC controller-based one) would need a differently
# shaped project file entirely, so it stays at the leaf that actually needs it.
#
# No version line exists yet - `hello-world` is this scaffold's only registered value so far,
# `default: true` so no flag is needed to reach it.

variables:
  - name: "ProjectName"
    prompt: "Project/assembly/namespace name"
    flag: "project-name"
    default: "HelloWorldDemo"
  - name: "Description"
    prompt: "Project description"
    flag: "description"
    default: "Generated by scaffold"
  - name: "DotnetVersion"
    prompt: ".NET version written into TargetFramework (net<version>)"
    flag: "dotnet-version"
    default: "9.0"

files:
  # `.gitignore` cannot be checked in under its real name (git would apply it to
  # scaffolding-code itself), so it is stored renamed and left untemplated - same reasoning as
  # spring-boot/jig.yaml.
  - path: "gitignore.tpl"
    target: ".gitignore"
    template: false
  - path: "editorconfig.tpl"
    target: ".editorconfig"
    template: false

# PROOF THAT WHAT WE GENERATE ACTUALLY RUNS, run by `scaffold lint --build` (never during
# `create`). A minimal xUnit test project (using WebApplicationFactory) exercises /healthz over
# a real in-memory HTTP pipeline, not just template rendering.
verify:
  - name: "builds"
    description: "dotnet build - compiles both the app and its test project"
    command: ["dotnet", "build"]
    timeout: "5m"
  - name: "tests-pass"
    description: "dotnet test - runs the generated app's WebApplicationFactory-based test suite"
    command: ["dotnet", "test"]
    timeout: "5m"

values:
  - name: "hello-world"
    description: "Minimal runnable ASP.NET Core Minimal API - no persistence, just two routes"
    default: true
