name: "Go (chi)"
description: "Registry of supported variants, plus everything identical across all of them"

# LEVEL 1, mirroring spring-boot/jig.yaml's own split: anything whose *shape* is the same for
# every go-chi variant lives here (go.mod, .gitignore, .editorconfig, the three variables every
# variant needs) so a future variant only ever declares its differences.
#
# No version line exists yet - `hello-world` is this scaffold's only registered value so far,
# `default: true` so no flag is needed to reach it.

variables:
  - name: "ModulePath"
    prompt: "Go module path (e.g. github.com/company/hello-world-demo)"
    flag: "module-path"
    default: "github.com/company/hello-world-demo"
  - name: "Description"
    prompt: "Project description"
    flag: "description"
    default: "Generated by scaffold"
  - name: "GoVersion"
    prompt: "Go release written into go.mod"
    flag: "go-version"
    default: "1.23"

computed:
  # The module's last path segment, e.g. "hello-world-demo" out of
  # "github.com/company/hello-world-demo" - used for the greeting/log text so a template author
  # never has to keep a second, separately-typed name in sync with the module path.
  - name: "ServiceName"
    value: '{{ .ModulePath | base }}'

files:
  # `.gitignore` cannot be checked in under its real name (git would apply it to
  # scaffolding-code itself), so it is stored renamed and left untemplated - same reasoning as
  # spring-boot/jig.yaml.
  - path: "gitignore.tpl"
    target: ".gitignore"
    template: false
  - path: "editorconfig.tpl"
    target: ".editorconfig"
    template: false
  - path: "go.mod.tpl"
    target: "go.mod"

# PROOF THAT WHAT WE GENERATE ACTUALLY RUNS, run by `scaffold lint --build` (never during
# `create`). No go.sum is shipped - `go mod tidy` resolves and downloads it fresh, the same
# "don't ship a lockfile" choice node-express/python-fastapi made for their own package managers.
verify:
  - name: "tidy"
    description: "go mod tidy - resolves and downloads the module's dependencies"
    command: ["go", "mod", "tidy"]
    timeout: "3m"
  - name: "builds"
    description: "go build ./... - compiles the generated service"
    command: ["go", "build", "./..."]
    timeout: "3m"
  - name: "tests-pass"
    description: "go test ./... - runs the generated service's test suite"
    command: ["go", "test", "./..."]
    timeout: "3m"

values:
  - name: "hello-world"
    description: "Minimal runnable chi service - no persistence, just two routes"
    default: true
