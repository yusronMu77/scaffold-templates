name: "Scaffolding Code Root"
description: "Registry of supported scaffolds"

# This registry is MANDATORY (PRD Section 4.1): without it, a raw directory listing would
# register .git, .vscode and any stray folder here as a "scaffold". Same shape as every other
# level's `values:` - the root is not a special engine concept, just the top of the tree.
#
# Each entry distinguishes three identities (PRD Section 4.1):
#   name  - what the user types (here: the positional <scaffold>)
#   path  - the on-disk folder, when it differs from `name`
#   flag  - the CLI flag name, for entries selected by flag rather than positionally
values:
  - name: "spring-boot"
    description: "Spring Boot (Java/Maven)"
    # `path` omitted on purpose: the folder is spring-boot/ too. This was previously
    # `name: spring, path: spring-boot`, which made every documented command in every design
    # note fail with `unknown scaffold "spring-boot"` (design review 2026-07-27 section 2.1).
    # PRD Section 4.1 keeps an aliasing example as illustration; it needs no live demo here.
  - name: "node-express"
    description: "Node.js + Express (JavaScript)"
  - name: "python-fastapi"
    description: "Python + FastAPI"
  - name: "go-chi"
    description: "Go + chi"
  - name: "react-vite"
    description: "React + Vite (frontend)"
  - name: "rust-axum"
    description: "Rust + Axum"
  - name: "dotnet-minimal-api"
    description: ".NET + ASP.NET Core Minimal API"
