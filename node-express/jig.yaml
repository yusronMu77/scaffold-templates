name: "Node.js (Express)"
description: "Registry of supported variants, plus everything identical across all of them"

# LEVEL 1, mirroring spring-boot/jig.yaml's own split: anything whose *shape* is the same for
# every node-express variant lives here (package.json, .gitignore, .editorconfig, the three
# variables every variant needs) so a future variant only ever declares its differences.
#
# No version line exists yet (unlike spring-boot's 3.2.x/2.7.x) - `hello-world` is this
# scaffold's only registered value so far, `default: true` so no flag is needed to reach it.

variables:
  - name: "PackageName"
    prompt: "npm package name (also used in greetings/logs)"
    flag: "package-name"
    default: "hello-world-demo"
  - name: "Description"
    prompt: "Project description"
    flag: "description"
    default: "Generated by scaffold"
  - name: "NodeVersion"
    prompt: "Minimum Node.js version required (engines.node)"
    flag: "node-version"
    default: "20"

# Deep-merged rather than replaced, so a later invocation (e.g. a component adding an npm
# dependency) can add package.json keys without clobbering what an earlier invocation wrote -
# same mechanism spring-boot already uses for application.yml.
merge:
  - "package.json"

files:
  # `.gitignore` cannot be checked in under its real name (git would apply it to
  # scaffolding-code itself), so it is stored renamed and left untemplated - same reasoning as
  # spring-boot/jig.yaml.
  - path: "gitignore.tpl"
    target: ".gitignore"
    template: false
  - path: "editorconfig.tpl"
    target: ".editorconfig"
    template: false
  - path: "package.json.tpl"
    target: "package.json"

# PROOF THAT WHAT WE GENERATE ACTUALLY RUNS, run by `scaffold lint --build` (never during
# `create`). No package-lock.json is shipped - versions are pinned literals in package.json.tpl,
# so a fresh `npm install` is reproducible enough without one.
verify:
  - name: "install"
    description: "npm install - installs dependencies from the registry"
    command: ["npm", "install"]
    timeout: "5m"
  - name: "tests-pass"
    description: "npm test - runs the generated Express app's test suite (supertest against /healthz)"
    command: ["npm", "test"]
    timeout: "5m"

values:
  - name: "hello-world"
    description: "Minimal runnable Express app - no persistence, just two routes"
    default: true
