name: "Python (FastAPI)"
description: "Registry of supported variants, plus everything identical across all of them"

# LEVEL 1, mirroring spring-boot/jig.yaml's own split: anything whose *shape* is the same for
# every python-fastapi variant lives here (requirements.txt, .python-version, .gitignore,
# .editorconfig, the three variables every variant needs) so a future variant only ever declares
# its differences.
#
# No version line exists yet - `hello-world` is this scaffold's only registered value so far,
# `default: true` so no flag is needed to reach it.

variables:
  - name: "PackageName"
    prompt: "Project/app name (also used as the FastAPI title and in greetings)"
    flag: "package-name"
    default: "hello-world-demo"
  - name: "Description"
    prompt: "Project description"
    flag: "description"
    default: "Generated by scaffold"
  - name: "PythonVersion"
    prompt: "Python version this project targets (.python-version)"
    flag: "python-version"
    default: "3.11"

files:
  # `.gitignore` cannot be checked in under its real name (git would apply it to
  # scaffolding-code itself), so it is stored renamed and left untemplated - same reasoning as
  # spring-boot/jig.yaml.
  - path: "gitignore.tpl"
    target: ".gitignore"
    template: false
  - path: "editorconfig.tpl"
    target: ".editorconfig"
    template: false
  - path: "python-version.tpl"
    target: ".python-version"
  - path: "requirements.txt.tpl"
    target: "requirements.txt"
    template: false

# PROOF THAT WHAT WE GENERATE ACTUALLY RUNS, run by `scaffold lint --build` (never during
# `create`). Trusts `python`/`pip` on PATH the same way spring-boot's verify trusts `mvn` and
# node-express's trusts `npm` - whoever runs `lint --build` is responsible for having the
# toolchain available, not this file.
verify:
  - name: "install"
    description: "pip install -r requirements.txt"
    command: ["pip", "install", "-q", "-r", "requirements.txt"]
    timeout: "5m"
  - name: "tests-pass"
    description: "pytest - runs the generated FastAPI app's test suite (TestClient against /healthz)"
    command: ["pytest", "-q"]
    timeout: "3m"

values:
  - name: "hello-world"
    description: "Minimal runnable FastAPI app - no persistence, just two routes"
    default: true
