name: "React + Vite"
description: "Registry of supported variants, plus everything identical across all of them"

# LEVEL 1, mirroring spring-boot/jig.yaml's own split: anything whose *shape* is the same for
# every react-vite variant lives here (package.json, vite.config.ts, index.html, tsconfig.json,
# .gitignore, .editorconfig, the three variables every variant needs) so a future variant only
# ever declares its differences.
#
# No version line exists yet - `hello-world` is this scaffold's only registered value so far,
# `default: true` so no flag is needed to reach it.

variables:
  - name: "PackageName"
    prompt: "npm package name (also used as the page title and in the rendered greeting)"
    flag: "package-name"
    default: "hello-world-demo"
  - name: "Description"
    prompt: "Project description"
    flag: "description"
    default: "Generated by scaffold"
  - name: "NodeVersion"
    prompt: "Minimum Node.js version required (engines.node)"
    flag: "node-version"
    default: "20"

files:
  # `.gitignore` cannot be checked in under its real name (git would apply it to
  # scaffolding-code itself), so it is stored renamed and left untemplated - same reasoning as
  # spring-boot/jig.yaml.
  - path: "gitignore.tpl"
    target: ".gitignore"
    template: false
  - path: "editorconfig.tpl"
    target: ".editorconfig"
    template: false
  - path: "tsconfig.json.tpl"
    target: "tsconfig.json"
    template: false
  - path: "vite.config.ts.tpl"
    target: "vite.config.ts"
    template: false
  - path: "index.html.tpl"
    target: "index.html"
  - path: "package.json.tpl"
    target: "package.json"

# PROOF THAT WHAT WE GENERATE ACTUALLY BUILDS, run by `scaffold lint --build` (never during
# `create`). No package-lock.json is shipped - versions are pinned literals in package.json.tpl,
# so a fresh `npm install` is reproducible enough without one, same choice node-express made.
verify:
  - name: "install"
    description: "npm install - installs dependencies from the registry"
    command: ["npm", "install"]
    timeout: "5m"
  - name: "builds"
    description: "npm run build - type-strips and bundles the app with Vite"
    command: ["npm", "run", "build"]
    timeout: "5m"

values:
  - name: "hello-world"
    description: "Minimal React app rendering Hello, <PackageName>"
    default: true
