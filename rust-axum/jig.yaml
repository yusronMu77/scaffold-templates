name: "Rust (Axum)"
description: "Registry of supported variants, plus everything identical across all of them"

# LEVEL 1, mirroring spring-boot/jig.yaml's own split: anything whose *shape* is the same for
# every rust-axum variant lives here (Cargo.toml, .gitignore, .editorconfig, the three variables
# every variant needs) so a future variant only ever declares its differences.
#
# No version line exists yet - `hello-world` is this scaffold's only registered value so far,
# `default: true` so no flag is needed to reach it.

variables:
  - name: "CrateName"
    prompt: "Cargo package name"
    flag: "crate-name"
    default: "hello-world-demo"
  - name: "Description"
    prompt: "Project description"
    flag: "description"
    default: "Generated by scaffold"
  - name: "RustEdition"
    prompt: "Rust edition written into Cargo.toml"
    flag: "rust-edition"
    default: "2021"

files:
  # `.gitignore` cannot be checked in under its real name (git would apply it to
  # scaffolding-code itself), so it is stored renamed and left untemplated - same reasoning as
  # spring-boot/jig.yaml.
  - path: "gitignore.tpl"
    target: ".gitignore"
    template: false
  - path: "editorconfig.tpl"
    target: ".editorconfig"
    template: false
  - path: "Cargo.toml.tpl"
    target: "Cargo.toml"

# PROOF THAT WHAT WE GENERATE ACTUALLY RUNS, run by `scaffold lint --build` (never during
# `create`). No Cargo.lock is shipped - unlike `go build`, `cargo build` resolves and writes one
# fresh on its own when it's missing, so no extra tidy-style step is needed first.
verify:
  - name: "builds"
    description: "cargo build - compiles the generated service"
    command: ["cargo", "build"]
    timeout: "10m"
  - name: "tests-pass"
    description: "cargo test - runs the generated service's test suite"
    command: ["cargo", "test"]
    timeout: "5m"

values:
  - name: "hello-world"
    description: "Minimal runnable Axum service - no persistence, just two routes"
    default: true
