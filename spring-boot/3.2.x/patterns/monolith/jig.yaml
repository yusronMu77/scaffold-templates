name: "Monolith"
description: "One deployable unit - no service discovery, no remote calls to siblings"

# ---------------------------------------------------------------------------------------------
# An OVERLAY on the patterns dimension, selected with --style=monolith.
#
# Overlays are applied AFTER the whole base chain, ordered by merge_priority, so anything here wins
# over what the templates contributed. Keeping merge_priority explicit and equal across the three
# styles makes it obvious that they are alternatives rather than layers.
#
# A monolith is mostly defined by what it does NOT need: no discovery client, no circuit breaker,
# no remote configuration. So this overlay is deliberately small - it records the intent in
# configuration rather than pulling in machinery.
# ---------------------------------------------------------------------------------------------

merge_priority: 10

merge:
  - "src/main/resources/application.yml"
