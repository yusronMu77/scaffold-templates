name: "Client library"
description: "Typed client for calling another service"
type: "library"

# A client library speaks HTTP, so unlike the other libs it needs the web stack. Declaring it here
# rather than at libs/ keeps `common` and `domain` free of a dependency they never use.
variables:
  - name: "TargetService"
    prompt: "Name of the service this client calls"
    flag: "target"
    default: "payment"

# A file NAME on disk cannot contain "|", so `{{ .TargetService | title }}` is impossible as a
# filename - the same class of limitation that makes PackagePath necessary. Deriving the value here
# keeps the transformation in the data and lets the filename stay a plain placeholder.
computed:
  - name: "TargetServiceTitle"
    value: '{{ .TargetService | title }}'

dependencies:
  - groupId: "org.springframework.boot"
    artifactId: "spring-boot-starter-web"
