name: "Services"
description: "Anything runnable - pick what kind of work it does"

# ---------------------------------------------------------------------------------------------
# LEVEL 4 of the inheritance chain: templates/services/
#
# This level owns everything TRUE OF EVERY SERVICE, whatever it does: a web API, a scheduler, an
# event consumer. Each of those is a sibling under this folder and inherits all of it.
#
# That is the difference between this level and the ones above it: spring-boot/ holds what is true
# of every *artefact* (pom.xml, .gitignore), while this holds what is true of every *runnable
# service* - the main class, the context test, the Dockerfile, actuator. A library or a parent POM
# is not a service and correctly receives none of it.
#
# So when the differences between two services turn out to be small, the shared part is already
# here and neither of them repeats it. A deeper level can then:
#   - ADD      a file it needs (just drop it in)
#   - OVERRIDE one it inherited (same output path, deeper wins - see scheduler/Application.java)
#   - REMOVE   one it does not want (`exclude:` - see scheduler/none/manifest.yaml)
# ---------------------------------------------------------------------------------------------

selector: "function"
default: "web"

# The registry is the list of valid choices, so an entry here is a promise the folder behind it
# works. event-consumer/ exists as an empty placeholder; register it once it has a manifest.
values:
  - name: "web"
    description: "Serves inbound traffic (HTTP, gRPC, ...)"
  - name: "scheduler"
    description: "Runs work on a schedule, no inbound protocol"

# The java/test/resources layout rules are inherited from the framework level (spring-boot/), which
# is where they belong: they describe Maven, not services. Nothing to repeat here.

# Every service is a runnable Spring Boot app that should expose health/readiness.
dependencies:
  - groupId: "org.springframework.boot"
    artifactId: "spring-boot-starter"
  - groupId: "org.springframework.boot"
    artifactId: "spring-boot-starter-actuator"
  - groupId: "org.springframework.boot"
    artifactId: "spring-boot-starter-test"
    scope: "test"

# Deep-merged rather than replaced, so every level below can add keys to application.yml without
# restating the whole file. The path is the OUTPUT path, because that is what collisions key on.
merge_yaml:
  - "src/main/resources/application.yml"
