name: "Scheduler service"
description: "Runs work on a schedule - no inbound protocol"

# ---------------------------------------------------------------------------------------------
# LEVEL 5 (sibling of web/): services/scheduler/
#
# This folder is the proof that services/ is genuinely general. It inherits, without restating any
# of it: pom.xml, .gitignore, .editorconfig, .dockerignore, ApplicationTests, the Dockerfile, the
# actuator dependency, the base application.yml, and the java/test/resources layout rules.
#
# What it does itself is exactly the difference:
#   OVERRIDE  java/Application.java - same output path as the one at services/, deeper wins, and
#             this copy adds @EnableScheduling.
#
# What it does NOT inherit is equally deliberate: everything under web/ (server port, graceful
# shutdown, HTTP actuator exposure) belongs to that sibling, not here. A scheduler has no port.
#
# `selector: protocol` with a single value `none` is kept on purpose: it keeps the CLI grammar the
# same shape for every function, so `--protocol` means the same thing everywhere. "none" is a real,
# honest answer to "which protocol does it speak".
# ---------------------------------------------------------------------------------------------

selector: "protocol"
default: "none"

values:
  - name: "none"
    description: "No inbound protocol - triggered by the clock"
