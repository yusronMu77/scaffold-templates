name: "Scheduled job"
description: "One worked example job on a cron trigger"

# ---------------------------------------------------------------------------------------------
# LEVEL 6 (leaf): services/scheduler/none/
#
# All three inheritance operations appear on this page, which is why it is worth reading as the
# reference example:
#
#   ADD       java/job/{{ .JobName }}Job.java and resources/application.yml - simply dropped in.
#   OVERRIDE  handled one level up (scheduler/java/Application.java), not needed here.
#   REMOVE    `exclude:` below.
# ---------------------------------------------------------------------------------------------

variables:
  - name: "JobName"
    prompt: "Name of the example scheduled job"
    flag: "job"
    default: "Cleanup"
  - name: "JobCron"
    prompt: "Cron expression for the example job"
    flag: "cron"
    default: "0 0 * * * *"

# REMOVE what does not fit. services/ contributes ApplicationTests.java, a bare context-loads test.
# This template ships a test that starts the context AND asserts the job bean is registered, which
# makes the generic one redundant - two near-identical @SpringBootTest classes would just double the
# slowest part of the build for no extra coverage.
#
# Patterns match the OUTPUT path, and `**` spans any number of segments so this works whatever the
# package layout turns out to be. A pattern matching nothing is an error, not silently ignored, so a
# stale exclusion cannot rot unnoticed.
exclude:
  - "src/test/java/**/ApplicationTests.java"

merge:
  - "src/main/resources/application.yml"

# ---------------------------------------------------------------------------------------------
# `--mode` (scaffold-cli#79, mirrors #69 on the mvc leaf): a selector added ON TOP of this same
# leaf, not a replacement for it. Every file/variable declared above and below is inherited by
# BOTH values below, so `--mode=project` (the default) stays byte-for-byte identical to every
# scheduler create before this selector existed.
#
#   project  ->  none/project/jig.yaml is intentionally empty: nothing to add, walk ends there.
#   job      ->  none/job/jig.yaml adds `flat_output: true` and `exclude:`s away everything this
#                chain contributes ABOVE none/ (pom.xml, Application.java, Dockerfile, ...),
#                leaving only the job (+ its test) declared right here - see that folder's jig.yaml.
# ---------------------------------------------------------------------------------------------
selector: "mode"
default: "project"

values:
  - name: "project"
    description: "Full scheduler service, exactly as before this selector existed (default)"
  - name: "job"
    description: "Just one new job, to add into an already-existing scheduler service (flat_output)"

files:
  - path: "java/job/{{ .JobName }}Job.java.tpl"
    target: "src/main/java/{{ .PackagePath }}/job/{{ .JobName }}Job.java"
  - path: "test/{{ .JobName }}JobTests.java.tpl"
    target: "src/test/java/{{ .PackagePath }}/{{ .JobName }}JobTests.java"
  - path: "resources/application.yml.tpl"
    target: "src/main/resources/application.yml"
