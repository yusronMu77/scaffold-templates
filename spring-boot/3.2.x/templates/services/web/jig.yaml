name: "Web service"
description: "Serves inbound traffic - pick the protocol next"

# ---------------------------------------------------------------------------------------------
# LEVEL 5: services/web/
#
# Owns what is true of anything that LISTENS on a port, whatever protocol it speaks. A scheduler is
# a sibling of this folder and correctly gets none of it - it has no port, so a `server:` block or
# an HTTP actuator exposure would be noise there.
#
# This is the level that makes the "small differences" case work: web and scheduler share
# everything in services/ and diverge only from here down.
# ---------------------------------------------------------------------------------------------

selector: "protocol"
default: "rest-http"

# grpc/ exists as an empty placeholder; register it once it has a jig.yaml.
values:
  - name: "rest-http"
    description: "HTTP/JSON API"

merge:
  - "src/main/resources/application.yml"
