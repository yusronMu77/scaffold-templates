name: "Entity only (existing project)"
description: "Adds one entity's CRUD layer to an already-generated MVC project - no skeleton files"

# ---------------------------------------------------------------------------------------------
# LEVEL 8 (leaf): services/web/rest-http/mvc/entity/  (scaffold-cli#69)
#
# The other value of the `--mode` selector ../jig.yaml declares. Declares no files/variables/data
# of its own - the Model, DTO, Repository, Service and Controller (plus their NotFoundException/
# NotFoundHandler companions) and the `EntityName`/`data.entity.fields` shape are all inherited
# straight from ../jig.yaml, unchanged, the same walk-chain composition every level in this tree
# already relies on.
#
# What's left to say here is only the DIFFERENCE from a full `mvc` create:
#
#   `flat_output: true`  write straight into --output instead of nesting a new <name>/ project
#                         folder, so `--output=<existing-project-dir>` lands the CRUD files
#                         directly inside it (issue #53's mechanism, applied here for #69).
#
#   `exclude:`            this chain unconditionally contributes a whole new project's skeleton
#                         above this leaf (spring-boot/'s pom.xml + dotfiles, services/'s
#                         Application.java/ApplicationTests.java/Dockerfile, rest-http/'s
#                         ValidationExceptionHandler, and every level's application.yml merge) -
#                         none of that belongs when the target is a project that already exists,
#                         so it is stripped back out here rather than never collected at all.
#
# Safe to `create` repeatedly against the same --output with a different --entity each time (see
# the roadmap's "verify create twice with different --entity" spike) - nothing here writes a file
# whose name isn't already parameterised by EntityName.
#
# `verify:` overrides the inherited `compiles` check (spring-boot/jig.yaml's `mvn -B -q test`) by
# name: `lint --build` renders every combination into its OWN empty temp directory, so a leaf that
# deliberately excludes pom.xml has no POM for `mvn test` to run against there - unlike the real
# use case, an existing project that already has one. Nothing is actually lost: these are the same
# .tpl files --mode=project's own `compiles` check already builds, so `mvn --version` here only
# proves mvn itself is reachable, not a second, redundant compile of identical sources.
# ---------------------------------------------------------------------------------------------

flat_output: true

verify:
  - name: "compiles"
    description: "No standalone pom.xml to build against by design (see above) - the same source \
      files are already compiled by --mode=project's `compiles` check."
    command: ["mvn", "-B", "-q", "--version"]

exclude:
  - ".gitignore"
  - ".dockerignore"
  - ".editorconfig"
  - "pom.xml"
  - "Dockerfile"
  - "src/main/java/**/Application.java"
  - "src/test/java/**/ApplicationTests.java"
  - "src/main/java/**/web/ValidationExceptionHandler.java"
  - "src/main/resources/application.yml"
