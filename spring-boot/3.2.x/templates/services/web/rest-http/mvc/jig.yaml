name: "MVC (layered)"
description: "Controller -> Service -> Repository, with one worked example endpoint"

# ---------------------------------------------------------------------------------------------
# LEVEL 7 (leaf): services/web/rest-http/mvc/
#
# Notice how little is left to say. This template contributes ONLY the layered example itself:
#
#   - no pom.xml            (spring-boot/)
#   - no .gitignore         (spring-boot/)
#   - no Application.java   (services/)
#   - no ApplicationTests   (services/)
#   - no Dockerfile         (services/)
#   - no server config      (services/web/)
#   - no web dependencies   (services/web/rest-http/)
#   - no layout rules       (services/) - files just go in java/, test/, resources/
#
# The `files:` block below exists only because the source files carry an editor-only `.tpl` suffix
# (scaffolding-code/.vscode/README.md) - it restates the inherited java/resources layout by hand,
# since an explicit `target` overrides `layout:` rather than composing with it. It is not a
# resurrection of a table of contents: every entry here is a rename, not new structure.
#
# Adding another controller means creating one file under java/controller/. Nothing here changes.
#
# NEXT STEP, already anticipated: to offer a choice of database, turn this leaf into a selector node
# - add `selector: "database"` and a `values:` list, then move the database-specific files into
# subfolders (jpa-postgres/, mongo/, ...). Whatever stays common to all of them remains right here
# and is inherited, exactly as rest-http/ does for mvc/ today. Nothing above this level changes.
# ---------------------------------------------------------------------------------------------

variables:
  - name: "EntityName"
    prompt: "Name of the example domain entity"
    flag: "entity"
    default: "Item"

  # Worked example for insert_after/insert_before (scaffold-cli#11): off by default, so it doesn't
  # change what every ordinary `create` produces. Set --search-by-name=true (see
  # values/spring-boot/service-rest-mvc-search-by-name.yaml) to splice a findByName route into the
  # controller, service and repository this same leaf already writes - see the three
  # find-by-name.*.tpl files: entries below. Assumes the entity's default `name` field (see the
  # snippets themselves), same caveat as `create()`'s worked example already carries.
  - name: "WithSearchByName"
    prompt: "Add a findByName search route across controller/service/repository (demonstrates insert_after)"
    flag: "search-by-name"
    default: "false"

# ---------------------------------------------------------------------------------------------
# THE ENTITY'S SHAPE. A variable cannot hold this: it is a list of objects, and one of the keys is
# itself a list of annotation lines. That is what `data:` is for.
#
# One declaration drives six files across BOTH version lines - the model, the request DTO, the
# repository, the service and the controller in 3.2.x, plus the two Java 8 overrides in 2.7.x. The
# comma-handling and the three renderings of the list live in _helpers.tpl, so a file here just
# writes `{{ include "entity.params" . }}`.
#
# It is also the natural override point for a user: `-f my-entity.yaml` with a `data:` block of
# their own replaces this list without touching scaffolding-code. See
# values/spring-boot/service-mvc-entity.yaml.
#
# The default deliberately stays a single `name` field, so `create ... --entity=Order` with no
# values file still produces the same worked example it always did.
# ---------------------------------------------------------------------------------------------
data:
  entity:
    fields:
      - name: "name"
        type: "String"
        constraints:
          - '@NotBlank(message = "name must not be blank")'
          - '@Size(max = 200, message = "name must be at most 200 characters")'

merge:
  - "src/main/resources/application.yml"

# ---------------------------------------------------------------------------------------------
# `--mode` (scaffold-cli#69): a selector added ON TOP of this same leaf, not a replacement for it.
# Every file/variable/data declaration above and below stays exactly where it is and is inherited
# by BOTH values below - that is what makes `--mode=project` (the default) byte-for-byte identical
# to every `--structure=mvc` invocation before this selector existed.
#
#   project  ->  mvc/project/jig.yaml is intentionally empty: nothing to add, walk ends there.
#   entity   ->  mvc/entity/jig.yaml adds `flat_output: true` and `exclude:`s away everything this
#                chain contributes ABOVE mvc/ (pom.xml, Application.java, Dockerfile, ...), leaving
#                only the CRUD files declared right here - see that folder's own jig.yaml.
# ---------------------------------------------------------------------------------------------
selector: "mode"
default: "project"

values:
  - name: "project"
    description: "Full MVC project, exactly as before this selector existed (default)"
  - name: "entity"
    description: "Just the CRUD layer for one entity, to add into an existing project (flat_output)"

files:
  - path: "java/model/{{ .EntityName }}.java.tpl"
    target: "src/main/java/{{ .PackagePath }}/model/{{ .EntityName }}.java"
  - path: "java/dto/{{ .EntityName }}Request.java.tpl"
    target: "src/main/java/{{ .PackagePath }}/dto/{{ .EntityName }}Request.java"
  - path: "java/repository/{{ .EntityName }}Repository.java.tpl"
    target: "src/main/java/{{ .PackagePath }}/repository/{{ .EntityName }}Repository.java"
  - path: "java/service/{{ .EntityName }}Service.java.tpl"
    target: "src/main/java/{{ .PackagePath }}/service/{{ .EntityName }}Service.java"
  - path: "java/service/{{ .EntityName }}NotFoundException.java.tpl"
    target: "src/main/java/{{ .PackagePath }}/service/{{ .EntityName }}NotFoundException.java"
  - path: "java/controller/{{ .EntityName }}Controller.java.tpl"
    target: "src/main/java/{{ .PackagePath }}/controller/{{ .EntityName }}Controller.java"
  - path: "java/controller/{{ .EntityName }}NotFoundHandler.java.tpl"
    target: "src/main/java/{{ .PackagePath }}/controller/{{ .EntityName }}NotFoundHandler.java"
  - path: "resources/application.yml.tpl"
    target: "src/main/resources/application.yml"

  # See the WithSearchByName comment above. Each splices into a file this same leaf already
  # writes, right after the run writes it - the target doesn't need to pre-exist from an earlier
  # `create`.
  - path: "java/repository/find-by-name.repository.tpl"
    target: "src/main/java/{{ .PackagePath }}/repository/{{ .EntityName }}Repository.java"
    condition: "WithSearchByName"
    insert_after: "// @scaffold:repository-methods"
  - path: "java/service/find-by-name.service.tpl"
    target: "src/main/java/{{ .PackagePath }}/service/{{ .EntityName }}Service.java"
    condition: "WithSearchByName"
    insert_after: "// @scaffold:service-methods"
  - path: "java/controller/find-by-name.controller.tpl"
    target: "src/main/java/{{ .PackagePath }}/controller/{{ .EntityName }}Controller.java"
    condition: "WithSearchByName"
    insert_after: "// @scaffold:routes"
