name: "Spring Boot"
description: "Registry of supported versions, plus everything identical across all of them"

# ---------------------------------------------------------------------------------------------
# LEVEL 1 of the inheritance chain: spring-boot/
#
#   spring-boot/ -> <version>/ -> templates/ -> <template>/ -> ... -> <leaf>
#
# What belongs HERE: anything whose *shape* is the same for every Spring Boot version and every
# kind of artefact. Only the values differ, and values arrive through the render context - so the
# file is written once and never copied.
#
# What does NOT belong here: anything only runnable services need (Dockerfile, the main class),
# which lives at templates/services/ instead - a library or a parent POM must not receive it.
#
# A subfolder with its own jig.yaml (3.2.x/) is a discovery node, not content, so it is never
# mistaken for a template file.
#
# `selector: "scaffold-version"` below is the same mechanism services/jig.yaml uses to name its
# own `function` flag - version is not a special engine concept, just this scaffold's choice to
# use the selector mechanism for its version line, with `inherits:` between entries.
# ---------------------------------------------------------------------------------------------

variables:
  - name: "GroupId"
    prompt: "Maven groupId"
    flag: "group-id"
    default: "com.company"
  - name: "ArtifactId"
    prompt: "Maven artifactId (defaults to the positional <name>)"
    from_positional: name
  - name: "PackageName"
    prompt: "Base Java package"
    flag: "package"
    default: "com.company.app"
  - name: "Description"
    prompt: "Project description"
    flag: "description"
    default: "Generated by scaffold"

  # Declared here because the shared pom.xml needs them; supplied per version, because that is
  # where the correct value is actually known. `required: true` with no default means a version
  # that forgets to set one fails loudly instead of shipping a wrong release.
  - name: "SpringBootVersion"
    prompt: "Spring Boot release written into pom.xml"
    flag: "spring-boot-version"
    required: true
  - name: "JavaVersion"
    prompt: "Java release"
    flag: "java-version"
    required: true

  # What kind of Maven artefact this is. Defaults suit a runnable service; a library sets
  # ExecutableJar to false, and a parent POM sets Packaging to "pom" as well. Keeping these as
  # variables is what lets ONE pom.xml serve all three - the alternative is three near-identical
  # copies that drift apart.
  - name: "Packaging"
    prompt: "Maven packaging (jar or pom)"
    flag: "packaging"
    default: "jar"
  - name: "ExecutableJar"
    prompt: "Whether to attach the Spring Boot repackage plugin"
    flag: "executable-jar"
    default: "true"

# ---------------------------------------------------------------------------------------------
# STANDARD MAVEN LAYOUT - declared here, at the scaffold level, so it applies to EVERYTHING:
# services, libs, the parent POM, and the patterns/ overlay alike.
#
# It sat at services/ before, which was subtly wrong: patterns/ is a sibling dimension rather
# than a descendant of services/, so a pattern contributing java/ files would not have been
# mapped when overlaid onto a non-service template. Maven's layout is a property of the
# scaffold, not of one template, and this is where it belongs.
#
# The effect: any template anywhere just drops files into a plain java/, test/ or resources/ folder
# and declares nothing. Folders whose names contain placeholders cannot exist on disk at all (a
# path segment cannot contain "/"), so without this every file would need its own `files:` entry.
# ---------------------------------------------------------------------------------------------
# ---------------------------------------------------------------------------------------------
# THE SHAPE OF A DEPENDENCY, for this scaffold. The engine has no built-in notion of one - these
# two lines are the whole of Maven's vocabulary, declared in data (fundamental rule #1). An npm
# scaffold would write `[name, version]`; Go modules `[module, version]`.
#
# dependency_fields: every field an entry may have. Templates can then read any of them unguarded
#   (missing ones render empty), and a misspelled `artifctId:` is rejected by name instead of
#   silently rendering nothing.
#
# dependency_key: what makes two declarations the same dependency, for deduplication across the
#   chain. In Maven a second entry differing only in `scope` is still the same dependency and must
#   not appear twice in pom.xml.
# ---------------------------------------------------------------------------------------------
dependency_fields: ["groupId", "artifactId", "version", "scope", "type"]
dependency_key: ["groupId", "artifactId"]

layout:
  - from: "java"
    to: "src/main/java/{{ .PackagePath }}"
  - from: "test"
    to: "src/test/java/{{ .PackagePath }}"
  - from: "resources"
    to: "src/main/resources"
  - from: "test-resources"
    to: "src/test/resources"

computed:
  # A folder name on disk cannot contain "/", so a dotted package cannot become nested directories
  # through a folder name. It is derived here instead, and the layout rules at services/ use it.
  # Note the engine knows nothing about Java packages - this is data, not engine behaviour.
  - name: "PackagePath"
    value: '{{ .PackageName | replace "." "/" }}'

files:
  # `.gitignore` cannot be checked in under its real name (git would apply it to scaffolding-code
  # itself), so it is stored renamed. It must not be templated either: `target/` is not a
  # placeholder, but a future ignore rule containing braces would break the parser.
  - path: "gitignore.tpl"
    target: ".gitignore"
    template: false
  - path: "dockerignore.tpl"
    target: ".dockerignore"
    template: false
  - path: "editorconfig.tpl"
    target: ".editorconfig"
    template: false
  # `.tpl` here is only so an editor can highlight the `{{ }}` placeholders without VSCode's
  # Java/XML language servers trying to compile/parse the file as-is. Rendered normally.
  - path: "pom.xml.tpl"
    target: "pom.xml"

# ---------------------------------------------------------------------------------------------
# PROOF THAT WHAT WE GENERATE ACTUALLY BUILDS, run by `scaffold lint --build`.
#
# `lint` on its own proves the templates render: they parse, and every placeholder resolves. That
# is not the same as proving the result compiles, and the difference is not theoretical - a Node
# scaffold built to test this engine passed lint on every combination while producing JavaScript
# that would not run. No template language could have caught it. Only the build tool knows.
#
# Declared ONCE here, at the scaffold level, so all twenty combinations inherit it - services,
# libraries and the parent POM alike. A level that genuinely needs a different command overrides
# this one by name.
#
# The command is an argv LIST, not a shell string: it is handed to the OS directly, with no shell
# anywhere in the path. And `create` never runs it - only `lint --build`, which someone types
# deliberately.
# ---------------------------------------------------------------------------------------------
verify:
  - name: "compiles"
    description: "mvn test - compiles the sources and runs the generated tests"
    command: ["mvn", "-B", "-q", "test"]
    timeout: "10m"

# The flag that picks a version: same selector mechanism as any recursive template node
# (e.g. services/jig.yaml's `selector: "function"`) - version is not special engine vocabulary,
# just this scaffold's own choice of flag name for a registry whose entries use `inherits:`.
selector: "scaffold-version"
values:
  - name: "3.2.x"
    description: "Spring Boot 3.2 line (jakarta.*, Java 17+)"
    default: true
  - name: "2.7.x"
    description: "Spring Boot 2.7 line (javax.*, Java 8+) - legacy"
    # Inherits every template from 3.2.x and overrides ONLY what the older line changes.
    # Without this, supporting 2.7 would mean a second copy of the whole templates/ tree.
    inherits: "3.2.x"
  - name: "hello-world"
    description: "A simple Spring Boot application"
